module: mom-cache
version: 1.1
owner: mom-framework

governance:
  cacheScopes: [global, factory]
  factoryScopeSource: verified-server-ownership-context
  authorizationDecisionCache: forbidden-without-accepted-security-adr
  failureMode: cache-failure-becomes-miss-authoritative-loader-remains-source

configs:
  - key: mom.cache.environment
    environmentVariable: MOM_CACHE_ENVIRONMENT
    type: string
    default: local
    required: true
    sensitive: false
    owner: mom-framework
    failureMode: fail-fast-invalid-key-segment
    restartRequired: true
    cacheScope: namespace-for-global-and-factory
    resilienceProfile: not-applicable
    changeImpact: [redis-key-namespace, cache-cold-start]

  - key: mom.cache.caffeine.maximum-size
    environmentVariable: MOM_CACHE_CAFFEINE_MAXIMUM_SIZE
    type: long
    default: 10000
    required: false
    sensitive: false
    owner: mom-framework
    failureMode: use-framework-reasonable-default
    restartRequired: true
    cacheScope: per-region-process-local
    resilienceProfile: not-applicable
    changeImpact: [l1-memory-usage, cache-hit-rate]

  - key: mom.cache.caffeine.expire-after-write
    environmentVariable: MOM_CACHE_CAFFEINE_EXPIRE_AFTER_WRITE
    type: duration
    default: 10m
    required: false
    sensitive: false
    owner: mom-framework
    failureMode: legacy-api-default-only
    restartRequired: true
    cacheScope: legacy-global
    resilienceProfile: not-applicable
    changeImpact: [legacy-cache-freshness]

  - key: mom.cache.redis.key-prefix
    environmentVariable: MOM_CACHE_REDIS_KEY_PREFIX
    type: string
    default: "mom:cache"
    required: false
    sensitive: false
    owner: mom-framework
    failureMode: legacy-key-prefix-only
    restartRequired: true
    cacheScope: legacy-global
    resilienceProfile: not-applicable
    changeImpact: [legacy-redis-key-namespace]

  - key: mom.cache.redis.enabled
    environmentVariable: MOM_CACHE_REDIS_ENABLED
    type: boolean
    default: true
    required: false
    sensitive: false
    owner: mom-framework
    failureMode: l1-and-authoritative-loader-only
    restartRequired: true
    cacheScope: global-and-factory
    resilienceProfile: not-applicable
    changeImpact: [l2-availability, authoritative-source-load]

  - key: mom.cache.redis.timeout
    environmentVariable: MOM_CACHE_REDIS_TIMEOUT
    type: duration
    default: 200ms
    required: false
    sensitive: false
    owner: mom-framework
    failureMode: diagnostic-value-client-timeout-remains-authoritative
    restartRequired: true
    cacheScope: global-and-factory
    resilienceProfile: not-applicable
    changeImpact: [cache-diagnostics]
