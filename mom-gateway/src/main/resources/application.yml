server:
  port: ${SERVER_PORT:20000}

spring:
  application:
    name: mom-gateway
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:123456789}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_TIMEOUT:2s}
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:true}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:12345678}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        cluster-name: ${NACOS_CLUSTER_NAME:DEFAULT}
    gateway:
      server:
        webflux:
          observability:
            enabled: true
          routes:
            # 联调专用：/auth/test 默认每分钟只允许 1 次，便于手工稳定观察 429。
#            - id: auth-test
#              order: -20
#              uri: lb://mom-auth-server
#              predicates:
#                - Path=/auth/test
#              filters:
#                - StripPrefix=1
#                - name: RequestRateLimiter
#                  args:
#                    rate-limiter: "#{@momFailClosedRedisRateLimiter}"
#                    key-resolver: "#{@requestIdentityKeyResolver}"
#                    redis-rate-limiter.replenishRate: ${GATEWAY_AUTH_TEST_RATE_LIMIT_REPLENISH_RATE:1}
#                    redis-rate-limiter.burstCapacity: ${GATEWAY_AUTH_TEST_RATE_LIMIT_BURST_CAPACITY:60}
#                    redis-rate-limiter.requestedTokens: ${GATEWAY_AUTH_TEST_RATE_LIMIT_REQUESTED_TOKENS:60}

            # 登录接口独立限流：默认持续约 5 次/分钟，并允许瞬时 5 次突发。
            - id: auth-login
              order: -10
              uri: lb://mom-auth-server
              predicates:
                - Path=/auth/login
                - Method=POST
              filters:
                - StripPrefix=1
                - name: RequestRateLimiter
                  args:
                    rate-limiter: "#{@momFailClosedRedisRateLimiter}"
                    key-resolver: "#{@requestIdentityKeyResolver}"
                    redis-rate-limiter.replenishRate: ${GATEWAY_AUTH_LOGIN_RATE_LIMIT_REPLENISH_RATE:5}
                    redis-rate-limiter.burstCapacity: ${GATEWAY_AUTH_LOGIN_RATE_LIMIT_BURST_CAPACITY:300}
                    redis-rate-limiter.requestedTokens: ${GATEWAY_AUTH_LOGIN_RATE_LIMIT_REQUESTED_TOKENS:60}

            # Auth 常规 API。
            - id: auth-api
              order: 0
              uri: lb://mom-auth-server
              predicates:
                - Path=/auth/**
              filters:
                - StripPrefix=1
                - name: RequestRateLimiter
                  args:
                    rate-limiter: "#{@momFailClosedRedisRateLimiter}"
                    key-resolver: "#{@requestIdentityKeyResolver}"
                    redis-rate-limiter.replenishRate: ${GATEWAY_AUTH_RATE_LIMIT_REPLENISH_RATE:10}
                    redis-rate-limiter.burstCapacity: ${GATEWAY_AUTH_RATE_LIMIT_BURST_CAPACITY:20}
                    redis-rate-limiter.requestedTokens: ${GATEWAY_AUTH_RATE_LIMIT_REQUESTED_TOKENS:1}

            - id: system-api
              order: 0
              uri: lb://mom-system-server
              predicates:
                - Path=/system/**
              filters:
                - StripPrefix=1
                - name: RequestRateLimiter
                  args:
                    rate-limiter: "#{@momFailClosedRedisRateLimiter}"
                    key-resolver: "#{@requestIdentityKeyResolver}"
                    redis-rate-limiter.replenishRate: ${GATEWAY_SYSTEM_RATE_LIMIT_REPLENISH_RATE:10}
                    redis-rate-limiter.burstCapacity: ${GATEWAY_SYSTEM_RATE_LIMIT_BURST_CAPACITY:20}
                    redis-rate-limiter.requestedTokens: ${GATEWAY_SYSTEM_RATE_LIMIT_REQUESTED_TOKENS:1}

            - id: integration-service
              order: 0
              uri: lb://mom-integration-server
              predicates:
                - Path=/api/integration/**
              filters:
                - StripPrefix=1
                - name: RequestRateLimiter
                  args:
                    rate-limiter: "#{@momFailClosedRedisRateLimiter}"
                    key-resolver: "#{@requestIdentityKeyResolver}"
                    redis-rate-limiter.replenishRate: ${GATEWAY_INTEGRATION_RATE_LIMIT_REPLENISH_RATE:5}
                    redis-rate-limiter.burstCapacity: ${GATEWAY_INTEGRATION_RATE_LIMIT_BURST_CAPACITY:10}
                    redis-rate-limiter.requestedTokens: ${GATEWAY_INTEGRATION_RATE_LIMIT_REQUESTED_TOKENS:1}

management:
  otlp:
    metrics:
      export:
        enabled: ${OTEL_METRICS_EXPORT_ENABLED:false}
        # 注意：必须使用独立的 METRICS 环境变量
        url: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://127.0.0.1:4318/v1/metrics}
        # 建议明确配置，避免远端异常时长时间阻塞
        connect-timeout: ${OTEL_EXPORTER_OTLP_METRICS_CONNECT_TIMEOUT:2s}
        read-timeout: ${OTEL_EXPORTER_OTLP_METRICS_TIMEOUT:5s}
        # 指标推送周期
        step: ${OTEL_EXPORTER_OTLP_METRICS_STEP:30s}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,nacos-discovery
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
    propagation:
      type: w3c
    export:
      otlp:
        enabled: ${OTEL_TRACING_EXPORT_ENABLED:false}
    # 建议排障阶段先关闭指标 Exemplar
    # 确认 Metrics 和 Traces 都正常后，再改回 sampled-traces
    exemplars:
      include: ${OTEL_METRICS_EXEMPLARS_INCLUDE:none}
  opentelemetry:
    resource-attributes:
      # 强烈建议补充，否则可能出现 unknown_service
      service.name: ${spring.application.name}
      service.namespace: mom-platform
      deployment.environment.name: ${MOM_ENVIRONMENT:local}
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://127.0.0.1:4318/v1/traces}
          connect-timeout: ${OTEL_EXPORTER_OTLP_TRACES_CONNECT_TIMEOUT:2s}
          timeout: ${OTEL_EXPORTER_OTLP_TRACES_TIMEOUT:5s}
          transport: http

logging:
  pattern:
    correlation: "[trace_id=%X{traceId:-} span_id=%X{spanId:-}] "
