name: Observability Stack CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: observability-stack-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    name: Detect observability stack scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      observability: ${{ steps.scope.outputs.observability }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_ACTION: ${{ github.event.action }}
          PR_PREVIOUS_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
          MANUAL_SCOPE: ${{ github.event_name == 'workflow_dispatch' && 'observability' || 'auto' }}
        run: bash .github/scripts/detect-ci-scope.sh

  configuration-verification:
    name: Observability stack configuration verification
    needs: changes
    if: needs.changes.outputs.observability == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Verify framework modules
        run: >-
          bash scripts/codex-mvn-test.sh
          -pl mom-framework/mom-observation,mom-framework/mom-tracing,mom-framework/mom-logging,mom-framework/mom-metrics
          -am verify
      - name: Validate stack configuration files
        run: |
          test -s .github/observability/tempo-config.yml
          test -s .github/observability/loki-config.yml
          test -s .github/observability/prometheus.yml
          test -s .github/observability/alloy-config.alloy
          test -d .github/observability/grafana/provisioning
          test -d .github/observability/grafana/dashboards
      - name: Record retired fixture boundary
        run: |
          {
            echo '### Observability stack acceptance boundary'
            echo
            echo 'The Phase 01 probe-driven runtime stack smoke was retired with the fake endpoints.'
            echo 'Configuration and framework verification remain; a real business request path must restore Prometheus, Loki, Tempo and Grafana runtime acceptance.'
          } >> "$GITHUB_STEP_SUMMARY"
