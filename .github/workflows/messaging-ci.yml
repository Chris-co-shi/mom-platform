name: Messaging CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: messaging-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    name: Detect messaging scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      messaging: ${{ steps.scope.outputs.messaging }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_ACTION: ${{ github.event.action }}
          PR_PREVIOUS_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
          MANUAL_SCOPE: ${{ github.event_name == 'workflow_dispatch' && 'messaging' || 'auto' }}
        run: bash .github/scripts/detect-ci-scope.sh

  framework-verification:
    name: Messaging framework verification
    needs: changes
    if: needs.changes.outputs.messaging == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Verify messaging and outbox modules
        run: >-
          bash scripts/codex-mvn-test.sh
          -pl mom-framework/mom-messaging,mom-framework/mom-outbox
          -am verify
      - name: Record retired fixture boundary
        run: |
          {
            echo '### Messaging acceptance boundary'
            echo
            echo 'The MDM Phase 01 producer/consumer fixture was retired.'
            echo 'This workflow verifies framework contracts only; the first real domain event slice must restore real Broker, retry and DLQ acceptance.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: messaging-verification-diagnostics
          path: |
            .codex/runtime/logs/**
            .codex/runtime/summaries/**
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          if-no-files-found: ignore
          include-hidden-files: true
