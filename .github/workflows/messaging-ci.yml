name: Messaging CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: messaging-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    name: Detect messaging scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      messaging: ${{ steps.scope.outputs.messaging }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect messaging-related changes
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_ACTION: ${{ github.event.action }}
          PR_PREVIOUS_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
          MANUAL_SCOPE: ${{ github.event_name == 'workflow_dispatch' && 'messaging' || 'auto' }}
        run: bash .github/scripts/detect-ci-scope.sh

  rocketmq-outbox:
    needs: changes
    if: needs.changes.outputs.messaging == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Package MDM and Integration applications
        shell: bash
        run: >-
          bash scripts/codex-mvn-test.sh
          -DskipTests
          -pl :mom-mdm-server,:mom-integration-server
          -am package

      - name: Run RocketMQ Stream Outbox smoke test
        shell: bash
        run: |
          set -o pipefail
          bash .github/scripts/p01-s05-rocketmq-outbox-smoke.sh \
            2>&1 | tee p01-s05-smoke.log

      - name: Upload messaging diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: messaging-verification-diagnostics
          path: |
            messaging-build.log
            .codex/runtime/logs/**
            .codex/runtime/summaries/**
            p01-s05-smoke.log
            p01-s05-postgresql.log
            p01-s05-rocketmq-namesrv.log
            p01-s05-rocketmq-broker.log
            p01-s05-mdm-server.log
            p01-s05-integration-server.log
            p01-s05-mdm-health.json
            p01-s05-integration-health.json
            p01-s05-normal-create.json
            p01-s05-outage-create.json
            p01-s05-poison-create.json
            p01-s05-dlq-status.txt
            p01-s05-outbox-status.txt
            p01-s05-inbox-status.txt
            **/target/surefire-reports/**
          if-no-files-found: ignore
