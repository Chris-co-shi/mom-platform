name: Seata CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seata-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    name: Detect Seata scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      seata: ${{ steps.scope.outputs.seata }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Seata-related changes
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_ACTION: ${{ github.event.action }}
          PR_PREVIOUS_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
          MANUAL_SCOPE: ${{ github.event_name == 'workflow_dispatch' && 'seata' || 'auto' }}
        run: bash .github/scripts/detect-ci-scope.sh

  seata-at:
    name: Controlled Seata AT smoke
    needs: changes
    if: needs.changes.outputs.seata == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Package MDM and Integration applications
        shell: bash
        run: >-
          bash scripts/codex-mvn-test.sh
          -DskipTests
          -pl :mom-mdm-server,:mom-integration-server
          -am package

      - name: Run controlled Seata AT smoke test
        shell: bash
        run: bash .github/scripts/p01-s06-seata-at-smoke.sh

      - name: Upload Seata diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: seata-verification-diagnostics
          path: |
            .codex/runtime/logs/**
            .codex/runtime/summaries/**
            p01-s06-mdm-postgresql.log
            p01-s06-integration-postgresql.log
            p01-s06-seata-server.log
            p01-s06-mdm-migration.log
            p01-s06-integration-migration.log
            p01-s06-mdm-migration-health.json
            p01-s06-integration-migration-health.json
            p01-s06-mdm-server.log
            p01-s06-integration-server.log
            p01-s06-mdm-health.json
            p01-s06-integration-health.json
            p01-s06-success-response.json
            p01-s06-global-rollback-response.json
            p01-s06-participant-failure-response.json
            p01-s06-tc-outage-response.json
            p01-s06-status.txt
            **/target/surefire-reports/**
          if-no-files-found: ignore
          include-hidden-files: true
