name: Seata CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seata-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    name: Detect Seata scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      seata: ${{ steps.scope.outputs.seata }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_ACTION: ${{ github.event.action }}
          PR_PREVIOUS_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
          MANUAL_SCOPE: ${{ github.event_name == 'workflow_dispatch' && 'seata' || 'auto' }}
        run: bash .github/scripts/detect-ci-scope.sh

  framework-verification:
    name: Seata framework verification
    needs: changes
    if: needs.changes.outputs.seata == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Verify Seata integration module
        run: >-
          bash scripts/codex-mvn-test.sh
          -pl mom-framework/mom-seata
          -am verify
      - name: Record retired fixture boundary
        run: |
          {
            echo '### Seata acceptance boundary'
            echo
            echo 'The MDM/Integration Phase 01 dual-database fixture was retired.'
            echo 'This workflow verifies the integration module only; a real short-transaction caller must restore TC and dual-database acceptance before Seata is adopted.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: seata-verification-diagnostics
          path: |
            .codex/runtime/logs/**
            .codex/runtime/summaries/**
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          if-no-files-found: ignore
          include-hidden-files: true
