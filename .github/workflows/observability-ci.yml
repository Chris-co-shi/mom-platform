name: Observability CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: observability-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    name: Detect observability scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      observability: ${{ steps.scope.outputs.observability }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_ACTION: ${{ github.event.action }}
          PR_PREVIOUS_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
          MANUAL_SCOPE: ${{ github.event_name == 'workflow_dispatch' && 'observability' || 'auto' }}
        run: bash .github/scripts/detect-ci-scope.sh

  framework-verification:
    name: Observability framework verification
    needs: changes
    if: needs.changes.outputs.observability == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Verify observability modules
        run: >-
          bash scripts/codex-mvn-test.sh
          -pl mom-framework/mom-observation,mom-framework/mom-tracing,mom-framework/mom-logging,mom-framework/mom-metrics
          -am verify
      - name: Package representative applications
        run: >-
          bash scripts/codex-mvn-test.sh
          -DskipTests -pl :mom-gateway,:mom-mdm-server,:mom-integration-server -am package
      - name: Record retired fixture boundary
        run: |
          {
            echo '### Observability acceptance boundary'
            echo
            echo 'The fake Gateway -> Integration -> MDM probe chain was retired.'
            echo 'Framework and packaged-application compatibility remain verified; the first real cross-service use case must restore end-to-end trace acceptance.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: observability-verification-diagnostics
          path: |
            .codex/runtime/logs/**
            .codex/runtime/summaries/**
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          if-no-files-found: ignore
          include-hidden-files: true
