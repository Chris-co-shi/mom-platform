name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      infrastructure:
        description: Select infrastructure verification scope
        required: true
        default: auto
        type: choice
        options:
          - auto
          - none
          - all
          - nacos-redis
          - postgresql
          - seata

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect infrastructure scope
    runs-on: ubuntu-latest
    outputs:
      nacos_redis: ${{ steps.scope.outputs.nacos_redis }}
      postgresql: ${{ steps.scope.outputs.postgresql }}
      seata: ${{ steps.scope.outputs.seata }}
      mode: ${{ steps.scope.outputs.mode }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed infrastructure
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
          MANUAL_SCOPE: ${{ inputs.infrastructure || 'auto' }}
        run: bash .github/scripts/detect-ci-scope.sh

  verify:
    name: Fast reactor verification
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Clean verify reactor and architecture boundaries
        shell: bash
        run: bash scripts/codex-mvn-test.sh clean verify

      - name: Upload Maven diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maven-verification-diagnostics
          path: |
            .codex/runtime/logs/**
            .codex/runtime/summaries/**
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          if-no-files-found: ignore

  nacos-redis-smoke:
    name: Nacos and Redis integration smoke
    needs: [changes, verify]
    if: needs.changes.outputs.nacos_redis == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Package smoke-test applications
        shell: bash
        run: >-
          bash scripts/codex-mvn-test.sh
          -pl mom-gateway,mom-mdm-platform/mom-mdm-server,mom-integration-platform/mom-integration-server
          -am -DskipTests package

      - name: Run Nacos and Redis infrastructure smoke test
        shell: bash
        run: bash .github/scripts/nacos-redis-smoke.sh

      - name: Upload Nacos and Redis diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nacos-redis-diagnostics
          path: |
            .codex/runtime/logs/**
            .codex/runtime/summaries/**
            nacos-server.log
            redis-server.log
            mdm-server.log
            integration-server.log
            gateway-one.log
            gateway-one-rate-limit.log
            gateway-two-rate-limit.log
            nacos-smoke-response.json
            nacos-smoke-headers.txt
            idempotency-first.json
            idempotency-duplicate.json
            rate-limit-first.json
            rate-limit-second.json
            redis-failure-response.json
          if-no-files-found: ignore

  postgresql-smoke:
    name: PostgreSQL packaged application smoke
    needs: [changes, verify]
    if: needs.changes.outputs.postgresql == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Package MDM application
        shell: bash
        run: >-
          bash scripts/codex-mvn-test.sh
          -pl mom-mdm-platform/mom-mdm-server
          -am -DskipTests package

      - name: Run PostgreSQL packaged application smoke test
        shell: bash
        run: bash .github/scripts/p01-s04-postgresql-smoke.sh

      - name: Upload PostgreSQL diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: postgresql-diagnostics
          path: |
            .codex/runtime/logs/**
            .codex/runtime/summaries/**
            postgresql-server.log
            mdm-postgresql-server.log
            mdm-postgresql-health.json
            mdm-postgresql-prometheus.txt
            mdm-data-probe-create.json
            mdm-data-probe-read.json
            mdm-postgresql-failure.json
          if-no-files-found: ignore

  seata-verify:
    name: Seata scoped verification
    needs: [changes, verify]
    if: needs.changes.outputs.seata == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Verify Seata integration module
        shell: bash
        run: >-
          bash scripts/codex-mvn-test.sh
          -pl mom-framework/mom-seata
          -am verify

      - name: Explain Seata integration boundary
        shell: bash
        run: |
          {
            echo "### Seata verification boundary"
            echo
            echo "This job validates the scoped Maven integration module only."
            echo "A real TC plus two-database AT smoke test remains a separate explicit acceptance gate."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Seata diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: seata-diagnostics
          path: |
            .codex/runtime/logs/**
            .codex/runtime/summaries/**
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          if-no-files-found: ignore
