name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      infrastructure:
        description: Select infrastructure verification scope
        required: true
        default: auto
        type: choice
        options:
          - auto
          - none
          - all
          - nacos
          - redis
          - postgresql
          - messaging

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    name: Detect infrastructure scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      nacos: ${{ steps.scope.outputs.nacos }}
      redis_cache: ${{ steps.scope.outputs.redis_cache }}
      redis_idempotency: ${{ steps.scope.outputs.redis_idempotency }}
      redis_rate_limit: ${{ steps.scope.outputs.redis_rate_limit }}
      postgresql: ${{ steps.scope.outputs.postgresql }}
      messaging: ${{ steps.scope.outputs.messaging }}
      mode: ${{ steps.scope.outputs.mode }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed infrastructure
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_ACTION: ${{ github.event.action }}
          PR_PREVIOUS_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
          MANUAL_SCOPE: ${{ inputs.infrastructure || 'auto' }}
        run: bash .github/scripts/detect-ci-scope.sh

  verify:
    name: Fast reactor verification
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Clean verify reactor and architecture boundaries
        shell: bash
        run: bash scripts/codex-mvn-test.sh clean verify

      - name: Upload Maven diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maven-verification-diagnostics
          path: |
            .codex/runtime/logs/**
            .codex/runtime/summaries/**
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          if-no-files-found: ignore
          include-hidden-files: true

  nacos-discovery-smoke:
    name: Nacos discovery smoke
    needs: [changes, verify]
    if: needs.changes.outputs.nacos == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Package discovery smoke applications
        shell: bash
        run: >-
          bash scripts/codex-mvn-test.sh
          -pl mom-gateway,mom-mdm-platform/mom-mdm-server,mom-integration-platform/mom-integration-server
          -am -DskipTests package

      - name: Run Nacos discovery smoke test
        shell: bash
        run: bash .github/scripts/nacos-discovery-smoke.sh

      - name: Upload Nacos discovery diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nacos-discovery-diagnostics
          path: |
            .codex/runtime/logs/**
            .codex/runtime/summaries/**
            nacos-container-state.json
            nacos-discovery-server.log
            mdm-nacos-discovery.log
            integration-nacos-discovery.log
            gateway-nacos-discovery.log
            nacos-discovery-response.json
            nacos-discovery-headers.txt
            nacos-discovery-outage.json
            nacos-discovery-missing-instance.json
          if-no-files-found: ignore
          include-hidden-files: true

  redis-idempotency-smoke:
    name: Redis idempotency smoke
    needs: [changes, verify]
    if: needs.changes.outputs.redis_idempotency == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Package Integration application
        shell: bash
        run: >-
          bash scripts/codex-mvn-test.sh
          -pl mom-integration-platform/mom-integration-server
          -am -DskipTests package

      - name: Run Redis idempotency smoke test
        shell: bash
        run: bash .github/scripts/redis-idempotency-smoke.sh

      - name: Upload Redis idempotency diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: redis-idempotency-diagnostics
          path: |
            .codex/runtime/logs/**
            .codex/runtime/summaries/**
            redis-idempotency-container-state.json
            redis-idempotency-server.log
            integration-redis-idempotency.log
            idempotency-first.json
            idempotency-duplicate.json
            idempotency-case.json
            idempotency-unicode.json
            idempotency-space.json
            idempotency-compact.json
            redis-idempotency-failure.json
          if-no-files-found: ignore
          include-hidden-files: true

  redis-cache:
    name: Redis cache integration
    needs: [changes, verify]
    if: needs.changes.outputs.redis_cache == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Verify cache contract and real Redis recovery
        shell: bash
        run: >-
          bash scripts/codex-mvn-test.sh
          -pl mom-framework/mom-cache
          -am verify

      - name: Upload Redis cache diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: redis-cache-diagnostics
          path: |
            .codex/runtime/logs/**
            .codex/runtime/summaries/**
            mom-framework/mom-cache/target/surefire-reports/**
            mom-framework/mom-cache/target/failsafe-reports/**
          if-no-files-found: ignore
          include-hidden-files: true

  redis-rate-limit-smoke:
    name: Redis rate-limit smoke
    needs: [changes, verify]
    if: needs.changes.outputs.redis_rate_limit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Package Gateway application
        shell: bash
        run: >-
          bash scripts/codex-mvn-test.sh
          -pl mom-gateway
          -am -DskipTests package

      - name: Run Redis rate-limit smoke test
        shell: bash
        run: bash .github/scripts/redis-rate-limit-smoke.sh

      - name: Upload Redis rate-limit diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: redis-rate-limit-diagnostics
          path: |
            .codex/runtime/logs/**
            .codex/runtime/summaries/**
            redis-rate-limit-container-state.json
            redis-rate-limit-server.log
            redis-rate-limit-downstream.log
            gateway-one-redis-rate-limit.log
            gateway-two-redis-rate-limit.log
            rate-limit-first.json
            rate-limit-second.json
            redis-rate-limit-failure.json
            rate-limit-recovery.json
            redis-rate-limit-prometheus.txt
          if-no-files-found: ignore
          include-hidden-files: true

  postgresql-smoke:
    name: PostgreSQL packaged application smoke
    needs: [changes, verify]
    if: needs.changes.outputs.postgresql == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Package PostgreSQL applications
        shell: bash
        run: >-
          bash scripts/codex-mvn-test.sh
          -pl mom-mdm-platform/mom-mdm-server,mom-system-platform/mom-system-server
          -am -DskipTests package

      - name: Run MDM PostgreSQL packaged smoke
        shell: bash
        run: bash .github/scripts/mdm-postgresql-smoke.sh

      - name: Run System PostgreSQL packaged smoke
        shell: bash
        run: bash .github/scripts/system-postgresql-smoke.sh

      - name: Upload PostgreSQL diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: postgresql-diagnostics
          path: |
            .codex/runtime/logs/**
            .codex/runtime/summaries/**
            postgresql-server.log
            mdm-postgresql-server.log
            mdm-postgresql-health.json
            mdm-postgresql-prometheus.txt
            mdm-data-probe-create.json
            mdm-data-probe-read.json
            mdm-postgresql-failure.json
            system-postgresql-container.log
            system-postgresql-server.log
            system-postgresql-health.json
            system-postgresql-schema.txt
            system-postgresql-failure.json
          if-no-files-found: ignore
          include-hidden-files: true

  messaging-runtime-smoke:
    name: System Runtime Event RocketMQ smoke
    needs: [changes, verify]
    if: needs.changes.outputs.messaging == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Verify System Runtime Event delivery and cache invalidation
        shell: bash
        run: bash .github/scripts/system-rocketmq-runtime-event-smoke.sh

      - name: Record messaging acceptance evidence
        if: success()
        shell: bash
        run: |
          {
            echo "### System Runtime Event acceptance"
            echo
            echo "- Signed MOM JWT, Resource Server authorization and audit actor"
            echo "- Real System HTTP business write and PostgreSQL Outbox"
            echo "- RocketMQ normal and duplicate delivery"
            echo "- System Inbox idempotency and Redis cache invalidation"
            echo "- Broker outage RETRY and recovery"
            echo "- Redis outage PostgreSQL fallback in an isolated read-only instance"
            echo "- Poison message RocketMQ DLQ"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload System Runtime Event diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: system-runtime-event-diagnostics
          path: |
            .codex/runtime/logs/**
            .codex/runtime/summaries/**
            system-runtime-event-*.log
            system-runtime-event-*.json
            system-runtime-event-*.txt
          if-no-files-found: ignore
          include-hidden-files: true
