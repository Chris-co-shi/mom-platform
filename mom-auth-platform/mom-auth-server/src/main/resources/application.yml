server:
  port: 20001
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
spring:
  config:
    import: classpath:database-${MOM_DATABASE_VENDOR:postgresql}.yml
  application:
    name: mom-auth-server
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:192.168.3.2:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:7bf3eddeba98962121386a487649ac2f45b5564c06f9afcd}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        cluster-name: ${NACOS_CLUSTER_NAME:DEFAULT}
  data:
    redis:
      host: ${REDIS_HOST:192.168.3.2}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:b2523448f8705da99275bab2ff60eada7c387d3a4e903a5e}
      database: ${REDIS_DATABASE:0}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_COMMAND_TIMEOUT:2s}
  datasource:
    username: postgres
    password: ${POSTGRES_PASSWORD:12345678}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    validate-migration-naming: true
    clean-disabled: true
    baseline-on-migrate: false

mybatis-plus:
  global-config:
    banner: false
  configuration:
    map-underscore-to-camel-case: true

logging:
  pattern:
    correlation: "[trace_id=%X{traceId:-} span_id=%X{spanId:-}] "

mom:
  i18n:
    owner: auth
  auth:
    access-token-ttl: ${MOM_AUTH_ACCESS_TOKEN_TTL:8h}
  security:
    resource-server:
      enabled: true
      public-paths:
        - /sessions/login
