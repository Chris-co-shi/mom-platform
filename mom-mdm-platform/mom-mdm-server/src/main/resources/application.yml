server:
  port: ${SERVER_PORT:20200}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

spring:
  config:
    import: classpath:database-${MOM_DATABASE_VENDOR:postgresql}.yml
  application:
    name: mom-mdm-server
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_COMMAND_TIMEOUT:2s}
  datasource:
    username: ${POSTGRES_USERNAME:postgres}
    password: ${POSTGRES_PASSWORD:}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    validate-migration-naming: true
    clean-disabled: true
    baseline-on-migrate: false
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        cluster-name: ${NACOS_CLUSTER_NAME:DEFAULT}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

mom:
  code-rule:
    enabled: true
    owner: mdm
    generation:
      authority: mdm:code-rule:generate
    management:
      read-authority: mdm:code-rule:read
      write-authority: mdm:code-rule:write
  i18n:
    owner: mdm
  security:
    resource-server:
      enabled: ${MOM_RESOURCE_SERVER_ENABLED:true}
      public-paths:

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,nacos-discovery
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
    propagation:
      type: w3c
    export:
      otlp:
        enabled: ${OTEL_TRACING_EXPORT_ENABLED:false}
  opentelemetry:
    resource-attributes:
      service.namespace: mom-platform
      deployment.environment.name: ${MOM_ENVIRONMENT:local}
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://127.0.0.1:4318/v1/traces}
          timeout: ${OTEL_EXPORTER_OTLP_TRACES_TIMEOUT:2s}

logging:
  pattern:
    correlation: "[trace_id=%X{traceId:-} span_id=%X{spanId:-}] "
