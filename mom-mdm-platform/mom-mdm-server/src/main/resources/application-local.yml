# 仅供本机联调；Gateway 对外使用 /mdm 前缀并剥除，服务内部路由不带模块前缀。
server:
  address: 127.0.0.1

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

mom:
  security:
    resource-server:
      public-paths:
        - /i18n/runtime/**
        - /v3/api-docs/**
        - /swagger-ui/**
        - /swagger-ui.html
