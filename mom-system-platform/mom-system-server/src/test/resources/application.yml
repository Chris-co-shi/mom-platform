spring:
  datasource:
    hikari:
      # SpringBootTest 验证正式 System DataSource 边界，不接受 Hikari 默认值漂移。
      pool-name: mom-system-hikari
      minimum-idle: 1
      maximum-pool-size: 5
      connection-timeout: 3000
      validation-timeout: 2000
      leak-detection-threshold: 0
      connection-init-sql: SET TIME ZONE 'UTC'
  flyway:
    # System V1 集成测试必须完整执行不可修改的 V1～V9 历史迁移和当前 V10。
    target: 10
