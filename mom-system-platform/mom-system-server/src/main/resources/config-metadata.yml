module: mom-system-server
version: 1.0
owner: mom-system-platform

configs:
  - key: mom.i18n.runtime.base-path
    environmentVariable: MOM_I18N_RUNTIME_BASE_PATH
    type: string
    default: /api/system/i18n/runtime
    required: true
    sensitive: false
    owner: mom-framework/mom-webmvc
    failureMode: fail-fast-on-invalid-controller-mapping
    restartRequired: true
    changeImpact: [runtime-api-routing]
