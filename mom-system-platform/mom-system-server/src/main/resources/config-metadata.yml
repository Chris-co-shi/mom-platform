module: mom-system-server
version: 1.0
owner: mom-system-platform

configs:
  - key: mom.i18n.owner
    environmentVariable: MOM_I18N_OWNER
    type: string
    default: system
    required: true
    sensitive: false
    owner: mom-i18n
    failureMode: fail-fast-on-unsupported-owner
    restartRequired: true
    changeImpact: [i18n-store-table-ownership]
