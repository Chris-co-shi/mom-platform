server:
  port: ${SERVER_PORT:20300}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

spring:
  config:
    import: classpath:database-${MOM_DATABASE_VENDOR:postgresql}.yml
  application:
    name: mom-system-server
  datasource:
    username: postgres
    password: ${POSTGRES_PASSWORD:12345678}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    validate-migration-naming: true
    clean-disabled: true
    baseline-on-migrate: false
  data:
    redis:
      host: ${REDIS_HOST:192.168.3.2}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:b2523448f8705da99275bab2ff60eada7c387d3a4e903a5e}
      database: ${REDIS_DATABASE:0}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_COMMAND_TIMEOUT:2s}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:192.168.3.2:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:7bf3eddeba98962121386a487649ac2f45b5564c06f9afcd}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        cluster-name: ${NACOS_CLUSTER_NAME:DEFAULT}


mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

mom:
  i18n:
    owner: system
  security:
    resource-server:
      enabled: ${MOM_RESOURCE_SERVER_ENABLED:true}
      public-paths:
        - /actuator/health/**
        - /actuator/info
        - /error

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,nacos-discovery
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
    propagation:
      type: w3c
    export:
      otlp:
        enabled: ${OTEL_TRACING_EXPORT_ENABLED:false}

logging:
  pattern:
    correlation: "[trace_id=%X{traceId:-} span_id=%X{spanId:-}] "
