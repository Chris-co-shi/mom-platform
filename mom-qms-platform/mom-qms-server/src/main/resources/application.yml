server:
  port: ${SERVER_PORT:20500}
spring:
  config:
    import: classpath:database-${MOM_DATABASE_VENDOR:postgresql}.yml
  application:
    name: mom-qms-server
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_COMMAND_TIMEOUT:2s}
  datasource:
    username: ${POSTGRES_USERNAME:postgres}
    password: ${POSTGRES_PASSWORD:}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    validate-migration-naming: true
    clean-disabled: true
    baseline-on-migrate: false
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:}
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
mom:
  i18n:
    base-locale: zh-CN
    runtime:
      base-path: /i18n/runtime
    management:
      base-path: /i18n/messages
      read-authority: qms:i18n:read
      write-authority: qms:i18n:write
  security:
    resource-server:
      enabled: ${MOM_RESOURCE_SERVER_ENABLED:true}
      public-paths:
        - /i18n/runtime/**
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,nacos-discovery
  endpoint:
    health:
      probes:
        enabled: true
logging:
  pattern:
    correlation: "[trace_id=%X{traceId:-} span_id=%X{spanId:-}] "
