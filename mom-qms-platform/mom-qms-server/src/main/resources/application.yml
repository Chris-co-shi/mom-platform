server:
  port: ${SERVER_PORT:20500}
spring:
  application:
    name: mom-qms-server
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:5432}/${POSTGRES_DATABASE:mom_platform}?currentSchema=${POSTGRES_SCHEMA:mom_qms}&tcpKeepAlive=${POSTGRES_TCP_KEEP_ALIVE:true}&ApplicationName=${POSTGRES_APPLICATION_NAME:mom-qms-server}}
    username: ${POSTGRES_USERNAME:postgres}
    password: ${POSTGRES_PASSWORD:12345678}
    hikari:
      pool-name: ${POSTGRES_POOL_NAME:mom-qms-hikari}
      minimum-idle: ${POSTGRES_MINIMUM_IDLE:1}
      maximum-pool-size: ${POSTGRES_MAXIMUM_POOL_SIZE:5}
      connection-timeout: ${POSTGRES_CONNECTION_TIMEOUT:3000}
      validation-timeout: ${POSTGRES_VALIDATION_TIMEOUT:2000}
      connection-init-sql: SET TIME ZONE 'UTC'
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:123456789}
      database: ${REDIS_DATABASE:0}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_COMMAND_TIMEOUT:2s}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    create-schemas: true
    default-schema: ${POSTGRES_SCHEMA:mom_qms}
    schemas: ${POSTGRES_SCHEMA:mom_qms}
    locations: classpath:db/migration/qms
    validate-migration-naming: true
    clean-disabled: true
    baseline-on-migrate: false
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:true}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:12345678}
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
mom:
  i18n:
    base-locale: zh-CN
    runtime:
      base-path: /i18n/runtime
    management:
      base-path: /i18n/messages
      read-authority: qms:i18n:read
      write-authority: qms:i18n:write
  security:
    resource-server:
      enabled: ${MOM_RESOURCE_SERVER_ENABLED:true}
      public-paths:
        - /i18n/runtime/**
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,nacos-discovery
  endpoint:
    health:
      probes:
        enabled: true
logging:
  pattern:
    correlation: "[trace_id=%X{traceId:-} span_id=%X{spanId:-}] "
