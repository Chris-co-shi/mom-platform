server:
  port: ${SERVER_PORT:20800}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

spring:
  config:
    import: classpath:database-${MOM_DATABASE_VENDOR:postgresql}.yml
  application:
    name: mom-integration-server
  datasource:
    username: ${POSTGRES_USERNAME:mom}
    password: ${POSTGRES_PASSWORD:}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    validate-migration-naming: true
    clean-disabled: true
    baseline-on-migrate: false
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_TIMEOUT:2s}
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        cluster-name: ${NACOS_CLUSTER_NAME:DEFAULT}

mom:
  technical-probe:
    enabled: ${MOM_TECHNICAL_PROBE_ENABLED:false}
  idempotency:
    redis:
      environment: ${MOM_ENVIRONMENT:local}
      default-ttl: ${IDEMPOTENCY_DEFAULT_TTL:10m}
      failure-mode: ${IDEMPOTENCY_REDIS_FAILURE_MODE:FAIL_CLOSED}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,nacos-discovery
  endpoint:
    health:
      probes:
        enabled: true
  health:
    redis:
      enabled: ${MANAGEMENT_HEALTH_REDIS_ENABLED:true}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
    propagation:
      type: w3c
    export:
      otlp:
        enabled: ${OTEL_TRACING_EXPORT_ENABLED:false}
  opentelemetry:
    resource-attributes:
      service.namespace: mom-platform
      deployment.environment.name: ${MOM_ENVIRONMENT:local}
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://127.0.0.1:4318/v1/traces}
          timeout: ${OTEL_EXPORTER_OTLP_TRACES_TIMEOUT:2s}

logging:
  pattern:
    correlation: "[trace_id=%X{traceId:-} span_id=%X{spanId:-}] "
